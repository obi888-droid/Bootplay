<!-- =========================
     MODAL DE MENSAGEM
========================== -->

<div
    id="messageModal"
    class="message-modal"
>

    <div class="message-modal-content">

        <button
            type="button"
            id="closeMessageModal"
            class="close-message-modal"
            aria-label="Fechar"
        >
            ×
        </button>

        <div class="message-modal-header">

            <span class="message-icon">
                💬
            </span>

            <h2>
                ENVIAR MENSAGEM
            </h2>

            <p>
                Encontrou um erro, link faltando ou quer deixar uma sugestão?
            </p>

        </div>


        <form id="messageForm">

            <label for="messageType">
                Tipo da mensagem
            </label>

            <select
                id="messageType"
                required
            >

                <option value="">
                    Escolha uma opção
                </option>

                <option value="Erro no site">
                    🐛 Erro no site
                </option>

                <option value="Link faltando">
                    🔗 Link faltando
                </option>

                <option value="Sugestão">
                    💡 Sugestão
                </option>

                <option value="Outro">
                    ❓ Outro
                </option>

            </select>


            <label for="messageText">
                Sua mensagem
            </label>

            <textarea
                id="messageText"
                rows="6"
                maxlength="2000"
                placeholder="Escreva aqui o que aconteceu..."
                required
            ></textarea>


            <div class="message-form-actions">

                <button
                    type="button"
                    id="cancelMessageBtn"
                    class="message-cancel-btn"
                >
                    CANCELAR
                </button>

                <button
                    type="submit"
                    class="message-submit-btn"
                >
                    ENVIAR MENSAGEM
                </button>

            </div>

        </form>

    </div>

</div>


<!-- =========================
     CONFIRMAÇÃO DE ENVIO
========================== -->

<div
    id="messageConfirmModal"
    class="message-confirm-modal"
>

    <div class="message-confirm-content">

        <div class="confirm-icon">
            ⚠️
        </div>

        <h2>
            CONFIRMAR ENVIO
        </h2>

        <p>
            Tem certeza que deseja enviar esta mensagem?
        </p>

        <div class="message-confirm-actions">

            <button
                type="button"
                id="cancelMessageConfirm"
                class="message-cancel-btn"
            >
                CANCELAR
            </button>

            <button
                type="button"
                id="confirmMessageSend"
                class="message-submit-btn"
            >
                SIM, ENVIAR
            </button>

        </div>

    </div>

</div>
